name: Prepare Build Environment
description: Checkout sources, set up Python, copy workspace, and install stage dependencies
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Clone ungoogled-chromium
      shell: pwsh
      run: |
        if (Test-Path 'ungoogled-chromium') {
          Remove-Item -Recurse -Force 'ungoogled-chromium'
        }
        git clone --depth 1 https://github.com/Eloston/ungoogled-chromium.git ungoogled-chromium
        if ($LASTEXITCODE -ne 0) { throw "Clone failed" }

    - name: Verify ungoogled-chromium
      shell: pwsh
      run: |
        if (Test-Path 'ungoogled-chromium/utils') {
          Write-Host "✅ Successfully cloned ungoogled-chromium"
        } else {
          Write-Error "❌ Missing utils directory"
          exit 1
        }

    - name: Copy workspace to C:\
      shell: pwsh
      run: |
        robocopy . C:\ungoogled-chromium-windows /MIR /R:1 /W:1 /NP /NFL /NDL
        $exitCode = $LASTEXITCODE
        if ($exitCode -ge 8) {
          Write-Error "Robocopy failed with exit code $exitCode"
          exit $exitCode
        } else {
          Write-Host "Robocopy completed with code $exitCode (success)"
          exit 0
        }

    - name: Setup Stage
      shell: pwsh
      run: npm install
      working-directory: ./.github/actions/stage