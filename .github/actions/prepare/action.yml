name: Prepare Build Environment
description: Checkout sources, set up Python, copy workspace, and install stage dependencies
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Force update submodules
      shell: pwsh
      run: |
        if (Test-Path 'ungoogled-chromium') {
          Remove-Item -Recurse -Force 'ungoogled-chromium'
        }
        git submodule sync --recursive
        git submodule update --init --recursive --force
        if ($LASTEXITCODE -ne 0) { throw "Submodule update failed with exit code $LASTEXITCODE" }

    - name: Verify submodule
      shell: pwsh
      run: |
        if (Test-Path 'ungoogled-chromium/utils') {
          Write-Host "✅ Submodule successfully initialized"
        } else {
          Write-Error "❌ Submodule not found after update"
          Get-ChildItem -Recurse -Depth 2 -Path . | Select-Object FullName
          exit 1
        }

    - name: Copy workspace to C:\
      shell: pwsh
      run: |
        robocopy . C:\ungoogled-chromium-windows /MIR /R:1 /W:1 /NP /NFL /NDL
        if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE" }

    - name: Setup Stage
      shell: pwsh
      run: npm install
      working-directory: ./.github/actions/stage